name: Update jobs dataset

on:
  schedule:
    # Daily at 09:17 UTC (4:17am CDT, 3:17am CST). Off the top of the hour,
    # when GitHub's scheduled runs are busiest, and still well before the 7am CT check.
    - cron: '17 9 * * *'
    # Backups (11/2026): from 11/10 GitHub started the 09:17 run 7-8 hours late
    # (created around 17:00 UTC, after the 7am CT check). Two earlier slots give
    # GitHub more chances to start a run in time. The gate job below lets only
    # the first scheduled run of each UTC day refresh the data; later ones skip.
    - cron: '23 2 * * *'
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      liveness_only:
        description: 'Skip the dataset refresh and run only the browser liveness check'
        type: boolean
        default: false
      details_only:
        description: 'Skip the dataset refresh and only rebuild data/matches.json from the current jobs.json'
        type: boolean
        default: false
      dry_run:
        description: 'Try companies without writing anything: fetch.mjs arguments, e.g. --only=rippling or --company=EDO'
        type: string
        default: ''

permissions:
  contents: write

# One run at a time, so a late scheduled run and a manual run never push over
# each other. A run that arrives while one is going waits in the queue.
concurrency:
  group: update-jobs-dataset
  cancel-in-progress: false

jobs:
  # Decides whether a scheduled run should refresh. Manual runs always go
  # ahead. A scheduled run skips (update and liveness) when data/summary.json
  # on the branch was already generated today (UTC), which happens when an
  # earlier slot's run has finished.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: data/summary.json
          sparse-checkout-cone-mode: false
      - name: Skip a scheduled run if today's refresh already landed
        id: check
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f data/summary.json ]; then
            gen=$(node -e "try{console.log(String(require('./data/summary.json').generatedAt||'').slice(0,10))}catch(e){console.log('')}")
            today=$(date -u +%Y-%m-%d)
            echo "summary generatedAt date: ${gen:-none}, today (UTC): $today"
            if [ "$gen" = "$today" ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run"

  update:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.liveness_only) }}
    runs-on: ubuntu-24.04
    # Raised from 120 (11/2026) to leave room for the details step below.
    timeout-minutes: 150
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run fetcher
        if: ${{ !inputs.details_only && !inputs.dry_run }}
        run: node scripts/fetch.mjs

      - name: Dry run (writes nothing)
        if: ${{ inputs.dry_run != '' && inputs.dry_run != null }}
        env:
          DRY_ARGS: ${{ inputs.dry_run }}
        run: node scripts/fetch.mjs --dry-run $DRY_ARGS

      # Posting details for title matches (scripts/details.mjs). Additive: a
      # failure or timeout here leaves the refreshed dataset to be committed.
      - name: Read posting details for matches
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/details.mjs

      - name: Commit and push changes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/jobs.csv data/summary.json data/new-jobs.json data/new-jobs.xml
          for f in data/gone-jobs.json data/matches.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): daily jobs dataset refresh [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep 15
            done
          fi

  # Opens the few postings listed in data/liveness-targets.json in a real
  # headless browser and records what each page showed in data/liveness.json
  # (see scripts/liveness.mjs). Runs after the refresh so the morning check
  # sees both. It honors robots.txt, never tries to get past a CAPTCHA or bot
  # check, and cannot fail the dataset refresh.
  liveness:
    needs: [gate, update]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && !inputs.details_only && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Check out repo (latest, including the refresh commit)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser liveness check
        run: node scripts/liveness.mjs

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/liveness.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): nightly liveness check [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep 15
            done
          fi
