name: Update jobs dataset

on:
  schedule:
    # Daily at 09:17 UTC (4:17am CDT, 3:17am CST). Off the top of the hour,
    # when GitHub's scheduled runs are busiest, and still well before the 7am CT check.
    - cron: '17 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run fetcher
        run: node scripts/fetch.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/jobs.csv data/summary.json data/new-jobs.json data/new-jobs.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): daily jobs dataset refresh [skip ci]"
            git push
          fi
